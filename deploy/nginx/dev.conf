# Development reverse proxy. The production config adds TLS, HSTS and the
# static-SSR cache; the parts that matter for correctness are here so they are
# exercised in development too.

# Log format with the query string *stripped of the address parameter*. A
# family's typed address is geocoded in-request and never persisted
# (docs/plan/08-decisions.md D8); letting it land in an access log would make
# that promise false.
map $request_uri $loggable_uri {
    "~^(?<prefix>[^?]*)\?(?<query>.*)$"  "$prefix?<query-redacted>";
    default                               $request_uri;
}

log_format brighttime '$remote_addr - [$time_local] "$request_method $loggable_uri $server_protocol" '
                      '$status $body_bytes_sent rt=$request_time';

upstream brighttime_web { server web:8080; }
upstream brighttime_api { server api:8080; }

server {
    listen 80;
    server_name kettle.localhost localhost;

    access_log /var/log/nginx/access.log brighttime;

    # No third-party origins anywhere: no ad networks, no analytics vendors,
    # no CDN-hosted scripts. Analytics are first-party by policy.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=(), payment=()" always;

    client_max_body_size 32m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://brighttime_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /hubs/ {
        proxy_pass http://brighttime_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://brighttime_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

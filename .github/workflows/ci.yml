name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CI: true

jobs:
  build:
    name: build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore

      # Warnings are errors in Directory.Build.props, so a plain build is the gate.
      - run: dotnet build --no-restore -c Release

      - name: Formatting
        run: dotnet format --no-restore --verify-no-changes

      # Covers unit, architecture and integration tests. The integration tests
      # skip themselves when no container runtime is present; on this runner
      # one is, so they run for real.
      - name: Tests
        run: dotnet test --no-build -c Release

  schema:
    name: schema applies and matches the EF model
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: brighttime
          POSTGRES_USER: brighttime_migrator
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U brighttime_migrator -d brighttime"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Apply the DDL in order
        env:
          PGPASSWORD: ci-only
        run: |
          for f in db/schema/*.sql; do
            echo "==> $f"
            psql -h localhost -U brighttime_migrator -d brighttime \
                 -v ON_ERROR_STOP=1 -X -q -f "$f"
          done

      # 99-rls-and-grants.sql already raises if a module table is missing RLS,
      # so reaching this step means the isolation surface is complete. This
      # re-asserts it independently of the file having been edited.
      - name: Every module table has row-level security
        env:
          PGPASSWORD: ci-only
        run: |
          psql -h localhost -U brighttime_migrator -d brighttime -v ON_ERROR_STOP=1 -X -q -c "
            do \$\$
            declare v text;
            begin
              select string_agg(format('%s.%s', n.nspname, c.relname), ', ') into v
              from pg_class c join pg_namespace n on n.oid = c.relnamespace
              where c.relkind in ('r','p')
                and n.nspname in ('platform','identity','directory','opportunity','enrollment',
                                  'attendance','learning','community','workforce','landscape',
                                  'analytics','notify','integration')
                and not c.relrowsecurity and not c.relispartition;
              if v is not null then raise exception 'tables without RLS: %', v; end if;
            end \$\$;"

      - name: The app role cannot bypass row-level security
        env:
          PGPASSWORD: ci-only
        run: |
          psql -h localhost -U brighttime_migrator -d brighttime -v ON_ERROR_STOP=1 -X -q -c "
            do \$\$
            begin
              if exists (select 1 from pg_roles where rolname='brighttime_app' and (rolbypassrls or rolsuper))
              then raise exception 'brighttime_app must not have BYPASSRLS or SUPERUSER'; end if;
            end \$\$;"

  explain:
    name: finder query plans
    runs-on: ubuntu-latest
    needs: schema
    # The M1 gate: the finder's own SQL, run as brighttime_finder over 50,000 synthetic
    # listings, must use an index on the search table and estimate its rows within ten
    # times (FinderPlanTests). The plans are uploaded, so a regression arrives with them.
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: brighttime
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d brighttime"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Apply the DDL in order
        env:
          PGPASSWORD: ci-only
        run: |
          for f in db/schema/*.sql; do
            psql -h localhost -U postgres -d brighttime -v ON_ERROR_STOP=1 -X -q -f "$f"
          done

      - name: Plans, judged
        env:
          BRIGHTTIME_TEST_CONNECTION: "Host=localhost;Port=5432;Database=brighttime;Username=postgres;Password=ci-only"
          BRIGHTTIME_EXPLAIN_OUT: ${{ github.workspace }}/plans
        run: >-
          dotnet test --project tests/BrightTime.IntegrationTests -c Release
          -- --filter-class "BrightTime.IntegrationTests.FinderPlanTests"

      - name: Keep the plans
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finder-plans
          path: plans/

  e2e:
    name: accessibility and the finder without JavaScript
    runs-on: ubuntu-latest
    needs: schema
    # The M1 gate: axe-core finds no WCAG 2.2 A or AA violation on any public route in
    # Chromium or WebKit, and a family can search, filter, page, save and change language
    # with JavaScript off (BrightTime.E2E.Tests).
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: brighttime
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d brighttime"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The fixture rebuilds its own database, but the cluster-wide roles must exist first.
      - name: Apply the DDL in order
        env:
          PGPASSWORD: ci-only
        run: |
          for f in db/schema/*.sql; do
            psql -h localhost -U postgres -d brighttime -v ON_ERROR_STOP=1 -X -q -f "$f"
          done

      - run: dotnet build tests/BrightTime.E2E.Tests -c Release

      - name: Browsers
        run: pwsh artifacts/bin/BrightTime.E2E.Tests/release/playwright.ps1 install --with-deps chromium webkit

      - name: Gate
        env:
          BRIGHTTIME_TEST_CONNECTION: "Host=localhost;Port=5432;Database=brighttime;Username=postgres;Password=ci-only"
        run: dotnet test --project tests/BrightTime.E2E.Tests -c Release --no-build

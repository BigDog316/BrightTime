# Local development stack. One command to a working, seeded site:
#
#   docker compose -f deploy/compose.yml up --build
#
# then browse http://kettle.localhost:8000 (plain localhost is a 404: the tenant comes from the
# host name). Sign in to the consoles at /dev/sign-in; mail lands in mailpit at
# http://localhost:8025.
#
# The database is built from db/schema on first boot only. After a schema change:
#
#   docker compose -f deploy/compose.yml down -v
#
# Nothing here is production configuration. Every password below is local only. Connection
# strings turn off GSS encryption: Npgsql tries it by default, and the .NET images have no
# Kerberos library to try it with.
name: brighttime

services:
  postgres:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: brighttime
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-only-not-a-secret
      # The password of the logins init-brighttime.sh creates for the hosts.
      BRIGHTTIME_LOGIN_PASSWORD: local-only-not-a-secret
      # The DDL is written for this collation; a different one changes
      # citext comparison and index ordering.
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # The postgres 18 image keeps its cluster in a versioned directory under this path.
      - postgres-data:/var/lib/postgresql
      - ../db/schema:/brighttime/schema:ro
      - ./postgres/init-brighttime.sh:/docker-entrypoint-initdb.d/init-brighttime.sh:ro
    healthcheck:
      # Over TCP: the temporary server that runs the init script listens on the socket only, so
      # a socket probe would pass before the schema exists.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d brighttime"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    command:
      - postgres
      # Enough shared memory for the GIN and GiST indexes the finder leans on.
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=16MB
      # Log anything slower than a page load so a plan regression is visible
      # in development rather than in production.
      - -c
      - log_min_duration_statement=200
      - -c
      - log_line_prefix=%m [%p] %u@%d
      - -c
      - track_io_timing=on

  # Loads the Kettle County tenant, then exits. Safe on every `up`: existing rows are left alone
  # and every listing is projected again (docs/seed.md). The seed spans the whole tenant, so it
  # runs as the superuser.
  seed:
    build:
      context: ..
      dockerfile: deploy/seed.Dockerfile
    command:
      - --connection
      - Host=postgres;Database=brighttime;Username=postgres;Password=local-only-not-a-secret;GSS Encryption Mode=Disable
    depends_on:
      postgres:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.22
    ports:
      - "127.0.0.1:8025:8025"   # web UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  nominatim:
    # Self-hosted geocoding: a family's typed address must not reach a vendor.
    # See docs/plan/08-decisions.md D8 and open question Q7.
    image: mediagis/nominatim:4.5
    environment:
      PBF_URL: https://download.geofabrik.de/north-america/us/new-york-latest.osm.pbf
      REPLICATION_URL: https://download.geofabrik.de/north-america/us/new-york-updates/
      IMPORT_WIKIPEDIA: false
      NOMINATIM_PASSWORD: local-only-not-a-secret
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - nominatim-data:/var/lib/postgresql/16/main
    shm_size: 1gb
    # Not started by a plain `up`, and the initial import is long. Start it explicitly:
    #   docker compose -f deploy/compose.yml --profile geocoding up nominatim
    profiles: ["geocoding"]

  # No object storage until media storage is decided: nothing reads Storage:* yet, and
  # minio/minio is no longer published on Docker Hub.

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__App: >-
        Host=postgres;Database=brighttime;Username=bt_web_login;Password=local-only-not-a-secret;GSS Encryption Mode=Disable;
        Include Error Detail=true;Max Auto Prepare=32
      ConnectionStrings__Auth: >-
        Host=postgres;Database=brighttime;Username=bt_auth_login;Password=local-only-not-a-secret;GSS Encryption Mode=Disable
      Tenancy__PublicScheme: http
      Tenancy__PublicPort: 8000
      Network__TrustedNetworks__0: 172.16.0.0/12
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
    depends_on:
      seed:
        condition: service_completed_successfully

  jobs:
    build:
      context: ..
      dockerfile: deploy/jobs.Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Jobs: >-
        Host=postgres;Database=brighttime;Username=bt_jobs_login;Password=local-only-not-a-secret;GSS Encryption Mode=Disable
      Email__Host: mailpit
      Email__Port: 1025
    depends_on:
      seed:
        condition: service_completed_successfully

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      Finder__Mode: Sql
      Finder__ConnectionString: >-
        Host=postgres;Database=brighttime;Username=bt_web_login;Password=local-only-not-a-secret;GSS Encryption Mode=Disable
      Auth__ConnectionString: >-
        Host=postgres;Database=brighttime;Username=bt_auth_login;Password=local-only-not-a-secret;GSS Encryption Mode=Disable
      # Lists the seeded accounts at /dev/sign-in. Development only (D14).
      Auth__DevelopmentSignIn: "true"
      Email__Host: mailpit
      Email__Port: 1025
      Tenancy__PublicScheme: http
      Tenancy__PublicPort: 8000
      # nginx has no fixed address on the compose network, so trust the network. In
      # production, list the proxy's address in Network__TrustedProxies__0 instead.
      Network__TrustedNetworks__0: 172.16.0.0/12
    depends_on:
      seed:
        condition: service_completed_successfully

  # The way in: tenants are told apart by host name, and their addresses carry port 8000.
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8000:80"
    depends_on:
      - web
      - api

volumes:
  postgres-data:
  nominatim-data:

<svg class="figure" viewBox="0 0 680 410" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The three hosts and the database">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#17324d"/>
    </marker>
  </defs>
  <style>
    .t { font-family: "Segoe UI", sans-serif; fill: #17324d; }
    .h { font-size: 15px; font-weight: 600; }
    .s { font-size: 11.5px; fill: #4a5a6b; }
    .w { fill: #ffffff; }
    .box { fill: #eef3f8; stroke: #17324d; stroke-width: 1.4; }
    .line { stroke: #17324d; stroke-width: 1.4; fill: none; }
  </style>
  <rect x="40" y="8" width="600" height="46" rx="8" fill="#17324d"/>
  <text class="t h w" x="340" y="30" text-anchor="middle">nginx</text>
  <text class="t s" x="340" y="46" text-anchor="middle" style="fill:#c9d6e3">TLS, security headers, routing by host name</text>

  <path class="line" d="M165,54 V96" marker-end="url(#arr)"/>
  <path class="line" d="M515,54 V96" marker-end="url(#arr)"/>
  <text class="t s" x="175" y="80">everything else</text>
  <text class="t s" x="525" y="80">/api/</text>

  <rect class="box" x="40" y="98" width="250" height="92" rx="8"/>
  <text class="t h" x="165" y="124" text-anchor="middle">BrightTime.Web</text>
  <text class="t s" x="165" y="146" text-anchor="middle">The finder (static SSR), consoles,</text>
  <text class="t s" x="165" y="162" text-anchor="middle">account pages, app-link files</text>
  <text class="t s" x="165" y="178" text-anchor="middle">Cookie sign-in</text>

  <rect class="box" x="390" y="98" width="250" height="92" rx="8"/>
  <text class="t h" x="515" y="124" text-anchor="middle">BrightTime.Api</text>
  <text class="t s" x="515" y="146" text-anchor="middle">/api/v1 for the app and integrations,</text>
  <text class="t s" x="515" y="162" text-anchor="middle">public reads, webhooks, badges</text>
  <text class="t s" x="515" y="178" text-anchor="middle">Bearer tokens</text>

  <path class="line" d="M165,190 V250 H262" marker-end="url(#arr)"/>
  <path class="line" d="M515,190 V250 H418" marker-end="url(#arr)"/>

  <path d="M264,222 v56 a76,13 0 0 0 152,0 v-56" fill="#f2a516" fill-opacity="0.16" stroke="#17324d" stroke-width="1.4"/>
  <ellipse cx="340" cy="222" rx="76" ry="13" fill="#fdf1d8" stroke="#17324d" stroke-width="1.4"/>
  <text class="t h" x="340" y="258" text-anchor="middle">PostgreSQL 18</text>
  <text class="t s" x="340" y="276" text-anchor="middle">PostGIS 3.6 · RLS</text>

  <path class="line" d="M340,328 V295" marker-end="url(#arr)"/>
  <rect class="box" x="215" y="330" width="250" height="70" rx="8"/>
  <text class="t h" x="340" y="356" text-anchor="middle">BrightTime.Jobs (worker)</text>
  <text class="t s" x="340" y="376" text-anchor="middle">Outbox dispatch, delivery jobs,</text>
  <text class="t s" x="340" y="391" text-anchor="middle">scheduled sweeps</text>
</svg>

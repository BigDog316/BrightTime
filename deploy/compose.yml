# Local development stack. One command to a working, seeded site:
#
#   docker compose -f deploy/compose.yml up --build
#
# Nothing here is production configuration — see compose.prod.yml, which uses
# a managed Postgres and real S3 and does not run mailpit.
name: brighttime

services:
  postgres:
    image: postgis/postgis:17-3.4
    environment:
      POSTGRES_DB: brighttime
      # Local only. Production credentials come from the secret store.
      POSTGRES_USER: brighttime_migrator
      POSTGRES_PASSWORD: local-only-not-a-secret
      # The DDL is written for this collation; a different one changes
      # citext comparison and index ordering.
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Applied in filename order on first boot: 00 extensions and roles,
      # 10..97 modules, 99 row-level security and grants last.
      - ../db/schema:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brighttime_migrator -d brighttime"]
      interval: 5s
      timeout: 5s
      retries: 20
    command:
      - postgres
      # Enough shared memory for the GIN and GiST indexes the finder leans on.
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=16MB
      # Log anything slower than a page load so a plan regression is visible
      # in development rather than in production.
      - -c
      - log_min_duration_statement=200
      - -c
      - log_line_prefix=%m [%p] %u@%d
      - -c
      - track_io_timing=on

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: brighttime
      MINIO_ROOT_PASSWORD: local-only-not-a-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.22
    ports:
      - "8025:8025"   # web UI
      - "1025:1025"   # SMTP
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  nominatim:
    # Self-hosted geocoding: a family's typed address must not reach a vendor.
    # See docs/plan/08-decisions.md D8 and open question Q7.
    image: mediagis/nominatim:4.5
    environment:
      PBF_URL: https://download.geofabrik.de/north-america/us/new-york-latest.osm.pbf
      REPLICATION_URL: https://download.geofabrik.de/north-america/us/new-york-updates/
      IMPORT_WIKIPEDIA: false
      NOMINATIM_PASSWORD: local-only-not-a-secret
    ports:
      - "8080:8080"
    volumes:
      - nominatim-data:/var/lib/postgresql/16/main
    shm_size: 1gb
    # The initial import is long. Start it explicitly:
    #   docker compose -f deploy/compose.yml up nominatim
    profiles: ["geocoding"]

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      # Unverified until the compose gate runs (Q11): the logins below must exist as LOGIN
      # roles that are members of brighttime_app and brighttime_auth.
      ConnectionStrings__App: >-
        Host=postgres;Database=brighttime;Username=brighttime_app;Password=local-only-not-a-secret;
        Include Error Detail=true;Max Auto Prepare=32
      ConnectionStrings__Auth: >-
        Host=postgres;Database=brighttime;Username=brighttime_auth;Password=local-only-not-a-secret
      Tenancy__PublicScheme: http
      Tenancy__PublicPort: 8000
      Storage__Endpoint: http://minio:9000
      Storage__Bucket: brighttime-dev
      Email__Host: mailpit
      Email__Port: 1025
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8081:8080"

  jobs:
    build:
      context: ..
      dockerfile: deploy/jobs.Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Jobs: >-
        Host=postgres;Database=brighttime;Username=brighttime_jobs;Password=local-only-not-a-secret
      Storage__Endpoint: http://minio:9000
      Email__Host: mailpit
      Email__Port: 1025
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      Finder__Mode: Sql
      Finder__ConnectionString: >-
        Host=postgres;Database=brighttime;Username=brighttime_app;Password=local-only-not-a-secret
      Auth__ConnectionString: >-
        Host=postgres;Database=brighttime;Username=brighttime_auth;Password=local-only-not-a-secret
      Tenancy__PublicScheme: http
      Tenancy__PublicPort: 8000
      # nginx has no fixed address on the compose network, so trust the network. In
      # production, list the proxy's address in Network__TrustedProxies__0 instead.
      Network__TrustedNetworks__0: 172.16.0.0/12
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8080"

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8000:80"
    depends_on:
      - web
      - api

volumes:
  postgres-data:
  minio-data:
  nominatim-data:
